; UniThrift Kiosk — PlatformIO configuration
; Board: ESP32 30-pin WROOM (NodeMCU-32S / DevKit v1)

[env:kiosk]
platform          = espressif32
board             = esp32dev
framework         = arduino
monitor_speed     = 115200
upload_speed      = 460800

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DWIFI_MANAGER_USE_ASYNC_WEB_SERVER=0   ; use sync server — more stable on ESP32

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    gilmaimon/ArduinoWebsockets @ ^0.5.3
    https://github.com/tzapu/WiFiManager.git
